<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bashith's Memory Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🧠 Memory Challenge</h1>

        <p class="subtitle">
            Match all the pairs before the timer runs out!
        </p>

        <div class="game-info">

            <div class="info-box">
                <span>⏱️ Time</span>
                <strong id="timer">60</strong>
            </div>

            <div class="info-box">
                <span>🎯 Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div class="info-box">
                <span>🏆 Score</span>
                <strong id="score">0</strong>
            </div>

        </div>

        <div id="game-board" class="game-board"></div>

        <button id="restart-btn" class="restart-btn">
            🔄 Restart Game
        </button>

        <p id="message" class="message"></p>

        <p class="creator">
            Built by <strong>Bashith Ali N</strong> 🚀
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
