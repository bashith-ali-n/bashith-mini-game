<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bashith's Memory Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- GAME TITLE -->
        <h1>🧠 Memory Challenge</h1>

        <p class="subtitle">
            Match all the pairs before the timer runs out!
        </p>


        <!-- DIFFICULTY -->
        <div class="difficulty-section">

            <label for="difficulty">
                🎚️ Select Difficulty
            </label>

            <select id="difficulty">

                <option value="easy">
                    🟢 EASY — 60 Seconds
                </option>

                <option value="medium">
                    🟡 MEDIUM — 45 Seconds
                </option>

                <option value="hard">
                    🔴 HARD — 30 Seconds
                </option>

            </select>

        </div>


        <!-- GAME INFORMATION -->
        <div class="game-info">

            <div class="info-box">
                <span>⏱️ Time</span>
                <strong id="timer">60</strong>
            </div>

            <div class="info-box">
                <span>🎯 Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div class="info-box">
                <span>🏆 Score</span>
                <strong id="score">0</strong>
            </div>

        </div>


        <!-- GAME BOARD -->
        <div id="game-board" class="game-board"></div>


        <!-- RESTART BUTTON -->
        <button
            id="restart-btn"
            class="restart-btn"
            type="button"
        >
            🔄 Restart Game
        </button>


        <!-- MESSAGE -->
        <p id="message" class="message"></p>


        <!-- CREATOR -->
        <p class="creator">
            Built by <strong>Bashith Ali N</strong> 🚀
        </p>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
